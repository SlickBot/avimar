<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>airnav map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
          crossorigin="" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
          crossorigin="" />
    <style>
        html, body, #map { margin: 0; padding: 0; height: 100%; width: 100%; background: #1a1a24; }
        .leaflet-container { background: #1a1a24; }
        .ac-icon { will-change: transform; }
        .ac-icon svg { display: block; }
        .ac-label {
            position: absolute;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            font: 10px/12px -apple-system, system-ui, sans-serif;
            color: #e6e6f0;
            background: rgba(16, 16, 24, 0.7);
            padding: 1px 4px;
            border-radius: 3px;
            white-space: nowrap;
            pointer-events: none;
        }
        .marker-cluster div { background: rgba(79,195,247,0.7); color: #101018; font-weight: 600; }
        .marker-cluster { background: rgba(79,195,247,0.25); }
    </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
        crossorigin=""></script>
<script src="airnav.js"></script>
</body>
</html>

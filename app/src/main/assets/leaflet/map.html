<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>airnav map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="" />
    <style>
        html, body, #map { margin: 0; padding: 0; height: 100%; width: 100%; background: #1a1a24; }
        .leaflet-container { background: #1a1a24; }
    </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
<script>
    (function () {
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: true,
        }).setView([45.801, 15.165], 6);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 22,
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
        }).addTo(map);

        window.airnav = {
            map: map,
            // placeholder hooks; populated in later phases
            updateAircraft: function (_json) {},
            updateVessels: function (_json) {},
        };
    })();
</script>
</body>
</html>

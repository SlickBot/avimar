<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>airnav map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #1a1a24; }
        #map { position: absolute; inset: 0; background: #1a1a24; }
        .leaflet-container { background: #1a1a24; }
        .ac-icon { will-change: transform; }
        .ac-icon svg { display: block; }
        .ac-label {
            position: absolute;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            font: 10px/12px -apple-system, system-ui, sans-serif;
            color: #e6e6f0;
            background: rgba(16, 16, 24, 0.7);
            padding: 1px 4px;
            border-radius: 3px;
            white-space: nowrap;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div id="map"></div>
<script>console.log('[map.html] body parsed');
window.addEventListener('error', function (e) {
    console.log('[window.error] ' + (e.message || e.type) + ' @ ' + (e.filename || '?') + ':' + (e.lineno || '?'));
});</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        onload="console.log('[map.html] leaflet.js loaded, L=' + (typeof L));"
        onerror="console.log('[map.html] leaflet.js FAILED to load');"></script>
<script src="airnav.js"
        onload="console.log('[map.html] airnav.js loaded');"
        onerror="console.log('[map.html] airnav.js FAILED to load');"></script>
</body>
</html>

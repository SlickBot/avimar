name: Set up build environment
description: Provisions the Temurin JDK, Gradle (with caching), and the Android SDK for avimar builds.

inputs:
  java-version:
    description: Temurin JDK version used to run Gradle.
    required: false
    default: '21'

runs:
  using: composite
  steps:
    - name: Set up JDK ${{ inputs.java-version }}
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    # Pinned to v5: v6 moved caching into a proprietary component under Gradle's Terms of Use.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v5

    # Only platform-tools: the legacy "tools" package (setup-android v3's default) is gone
    # from the SDK repo, and AGP downloads the platform and build-tools it needs itself.
    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: platform-tools
